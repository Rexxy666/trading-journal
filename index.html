/* ===================== MONTHLY CHART ===================== */
const MonthlyChart = ({ trades }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const data = useMemo(() => {
    const m = {};
    trades.filter(t => t.status === 'closed').forEach(t => {
      const d = t.type === 'option' ? t.closeDate : t.exitDate;
      if (!d) return;
      const key = d.slice(0, 7);
      m[key] = (m[key] || 0) + t.pnl;
    });
    const keys = Object.keys(m).sort();
    return {
      labels: keys.map(k => {
        const [y, mo] = k.split('-');
        return `${MONTHS_EN[parseInt(mo)-1]} '${y.slice(2)}`;
      }),
      values: keys.map(k => m[k])
    };
  }, [trades]);

  useEffect(() => {
    if (!canvasRef.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    if (data.labels.length === 0) return;
    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.labels,
        datasets: [{
          data: data.values,
          backgroundColor: data.values.map(v => v >= 0 ? '#22c55e28' : '#ef444428'),
          borderColor: data.values.map(v => v >= 0 ? '#22c55e' : '#ef4444'),
          borderWidth: 2,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            borderColor: '#334155',
            borderWidth: 1,
            titleColor: '#94a3b8',
            bodyColor: '#f1f5f9',
            callbacks: { label: ctx => ` ${fmtPnL(ctx.raw)}` }
          }
        },
        scales: {
          x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 12 } }, border: { color: '#334155' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#64748b', font: { size: 11 }, callback: v => fmt$(v) }, border: { color: '#334155' } }
        }
      }
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [data]);

  return (
    <div style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:12, padding:24 }}>
      <div style={{ fontWeight:700, fontSize:15, marginBottom:18 }}>每月損益 Monthly P&amp;L</div>
      {data.labels.length === 0
        ? <div style={{ height:200, display:'flex', alignItems:'center', justifyContent:'center', color:'#475569' }}>尚無已結清交易資料</div>
        : <div style={{ height:220 }}><canvas ref={canvasRef} /></div>
      }
    </div>
  );
};

/* ===================== EQUITY CURVE ===================== */
const EquityCurve = ({ trades }) => {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);

  const data = useMemo(() => {
    const closed = trades
      .filter(t => t.status === 'closed')
      .map(t => ({ date: t.type === 'option' ? t.closeDate : t.exitDate, pnl: t.pnl }))
      .filter(t => t.date)
      .sort((a, b) => a.date.localeCompare(b.date));
    if (closed.length === 0) return null;
    let cum = 0;
    const points = [{ date: 'Start', cum: 0 }];
    closed.forEach(t => { cum += t.pnl; points.push({ date: t.date, cum }); });
    return { labels: points.map(p => p.date), values: points.map(p => p.cum) };
  }, [trades]);

  useEffect(() => {
    if (!canvasRef.current || !data) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const lastVal = data.values[data.values.length - 1];
    const lineColor = lastVal >= 0 ? '#22c55e' : '#ef4444';
    const ctx = canvasRef.current.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, 160);
    gradient.addColorStop(0, lineColor + '40');
    gradient.addColorStop(1, lineColor + '00');
    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.labels,
        datasets: [{
          data: data.values,
          borderColor: lineColor,
          borderWidth: 2.5,
          fill: true,
          backgroundColor: gradient,
          tension: 0.4,
          pointRadius: data.values.length > 20 ? 0 : 4,
          pointBackgroundColor: lineColor,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            borderColor: '#334155',
            borderWidth: 1,
            titleColor: '#94a3b8',
            bodyColor: '#f1f5f9',
            callbacks: { label: ctx => ` Cumulative: ${fmtPnL(ctx.raw)}` }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 }, maxTicksLimit: 8 }, border: { color: '#334155' } },
          y: { grid: { color: '#334155' }, ticks: { color: '#64748b', font: { size: 11 }, callback: v => fmt$(v) }, border: { color: '#334155' } }
        }
      }
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [data]);

  if (!data) return null;
  return (
    <div style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:12, padding:24 }}>
      <div style={{ fontWeight:700, fontSize:15, marginBottom:18 }}>累計損益曲線 Equity Curve</div>
      <div style={{ height:180 }}><canvas ref={canvasRef} /></div>
    </div>
  );
};

/* ===================== CLOSE TRADE MODAL ===================== */
const CloseTradeModal = ({ trade, onClose, onSubmit }) => {
  const isStock = trade.type === 'stock';
  const [f, setF] = useState({ date: today(), price: '', notes: trade.notes || '' });

  const calcPnL = () => {
    const price = parseFloat(f.price);
    if (!price) return null;
    if (isStock) {
      const diff = trade.direction === 'long'
        ? (price - trade.entryPrice) * trade.shares
        : (trade.entryPrice - price) * trade.shares;
      return diff;
    } else {
      return (price - trade.entryPremium) * trade.contracts * 100;
    }
  };

  const pnl = calcPnL();

  const handleSubmit = () => {
    if (!f.price) { alert('請輸入價格'); return; }
    const price = parseFloat(f.price);
    onSubmit({
      status: 'closed',
      ...(isStock ? { exitDate: f.date, exitPrice: price } : { closeDate: f.date, exitPremium: price }),
      pnl: pnl || 0,
      notes: f.notes,
    });
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'#000000bb', display:'flex', alignItems:'center', justifyContent:'center', zIndex:200, padding:20 }}>
      <div className="fade-in" style={{ background:'#1e293b', borderRadius:16, padding:32, width:'100%', maxWidth:460, border:'1px solid #334155' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24 }}>
          <div>
            <div style={{ fontWeight:800, fontSize:18 }}>平倉 {trade.ticker}</div>
            <div style={{ color:'#64748b', fontSize:13, marginTop:4 }}>
              {isStock ? `${trade.direction === 'long' ? '做多' : '做空'} ${trade.shares} 股 @ $${trade.entryPrice}` : `${trade.optionType?.toUpperCase()} $${trade.strike} × ${trade.contracts} 張`}
            </div>
          </div>
          <button onClick={onClose} style={{ background:'#334155', border:'none', borderRadius:8, padding:7, color:'#94a3b8', display:'flex' }} className="action-btn">
            <Ico name="x" size={16} />
          </button>
        </div>

        <div style={{ display:'grid', gap:16 }}>
          <div>
            <label style={{ display:'block', color:'#94a3b8', fontSize:13, fontWeight:600, marginBottom:6 }}>平倉日期</label>
            <input type="date" value={f.date} onChange={e => setF({...f, date: e.target.value})} />
          </div>
          <div>
            <label style={{ display:'block', color:'#94a3b8', fontSize:13, fontWeight:600, marginBottom:6 }}>
              {isStock ? '賣出價 Exit Price' : '平倉 Premium'}
            </label>
            <input type="number" step="0.01" placeholder="0.00" value={f.price}
              onChange={e => setF({...f, price: e.target.value})} autoFocus />
          </div>

          {pnl !== null && (
            <div style={{ background: pnl >= 0 ? '#22c55e12' : '#ef444412', border:`1px solid ${pnl >= 0 ? '#22c55e40' : '#ef444440'}`, borderRadius:10, padding:18, textAlign:'center' }}>
              <div style={{ color:'#64748b', fontSize:12, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em' }}>預計損益</div>
              <div style={{ fontSize:32, fontWeight:900, color: pnl >= 0 ? '#4ade80' : '#f87171', marginTop:4 }}>{fmtPnL(pnl)}</div>
            </div>
          )}

          <div>
            <label style={{ display:'block', color:'#94a3b8', fontSize:13, fontWeight:600, marginBottom:6 }}>交易心得 (選填)</label>

/* ===================== ADD TRADE FORM ===================== */
const AddTradeForm = ({ onSubmit, onCancel }) => {
  const [type, setType] = useState('stock');
  const [f, setF] = useState({
    ticker:'', status:'open',
    direction:'long', shares:'', entryPrice:'', exitPrice:'', entryDate:today(), exitDate:'',
    optionType:'call', strike:'', expiry:'', contracts:'', entryPremium:'', exitPremium:'', openDate:today(), closeDate:'',
    notes:'', tags:''
  });
  const set = (k, v) => setF(prev => ({...prev, [k]: v}));

  const calcPnL = () => {
    if (f.status === 'open') return null;
    if (type === 'stock') {
      const entry = parseFloat(f.entryPrice), exit = parseFloat(f.exitPrice), shares = parseInt(f.shares);
      if (!entry || !exit || !shares) return null;
      return f.direction === 'long' ? (exit - entry) * shares : (entry - exit) * shares;
    } else {
      const ep = parseFloat(f.entryPremium), xp = parseFloat(f.exitPremium), c = parseInt(f.contracts);
      if (!ep || !xp || !c) return null;
      return (xp - ep) * c * 100;
    }
  };

  const pnl = calcPnL();

  const handleSubmit = () => {
    if (!f.ticker.trim()) { alert('請輸入股票代碼'); return; }
    const tags = f.tags ? f.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    const trade = {
      id: genId(), type, status: f.status, ticker: f.ticker.trim().toUpperCase(),
      pnl: pnl || 0, notes: f.notes.trim(), tags, createdAt: today(),
      ...(type === 'stock' ? {
        direction: f.direction,
        shares: parseInt(f.shares) || 0,
        entryPrice: parseFloat(f.entryPrice) || 0,
        exitPrice: f.status === 'closed' ? (parseFloat(f.exitPrice) || 0) : null,
        entryDate: f.entryDate, exitDate: f.status === 'closed' ? f.exitDate : null,
      } : {
        optionType: f.optionType,
        strike: parseFloat(f.strike) || 0,
        expiry: f.expiry,
        contracts: parseInt(f.contracts) || 0,
        entryPremium: parseFloat(f.entryPremium) || 0,
        exitPremium: f.status === 'closed' ? (parseFloat(f.exitPremium) || 0) : null,
        openDate: f.openDate, closeDate: f.status === 'closed' ? f.closeDate : null,
      })
    };
    onSubmit(trade);
  };

    <label style={{ display:'block', color:'#94a3b8', fontSize:12, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em', marginBottom:6 }}>{children}</label>

          {[['stock','📊 正股 Stock'],['option','🎯 期權 Option']].map(([val, label]) => (
            <button key={val} onClick={() => setType(val)} style={{
              flex:1, padding:'11px 0', borderRadius:8, border:'none',
              background: type === val ? '#3b82f6' : 'transparent',
              color: type === val ? '#fff' : '#64748b',
              fontWeight:700, fontSize:14, transition:'all 0.2s'

        <div style={{ display:'grid', gap:16 }}>
          <Row>
            <div>
              <LabelEl>股票代碼 Ticker *</LabelEl>

            </Row>
            <Row>
              <div>
                <LabelEl>買入日期 Entry Date</LabelEl>
                <input type="date" value={f.entryDate} onChange={e => set('entryDate', e.target.value)} />
              </div>
              <div>
                <LabelEl>買入價 Entry Price</LabelEl>

            {f.status === 'closed' && <Row>
              <div>
                <LabelEl>賣出日期 Exit Date</LabelEl>
                <input type="date" value={f.exitDate} onChange={e => set('exitDate', e.target.value)} />
              </div>
              <div>
                <LabelEl>賣出價 Exit Price</LabelEl>

            <Row>
              <div>
                <LabelEl>類型 Option Type</LabelEl>
                <select value={f.optionType} onChange={e => set('optionType', e.target.value)}>
                  <option value="call">Call (買權)</option>

              <div>

              </div>
            </Row>
            <Row>
              <div>
                <LabelEl>到期日 Expiry</LabelEl>
                <input type="date" value={f.expiry} onChange={e => set('expiry', e.target.value)} />
              </div>
              <div>
                <LabelEl>合約數 Contracts</LabelEl>
                <input type="number" placeholder="1" value={f.contracts} onChange={e => set('contracts', e.target.value)} />

            </Row>
            <Row>
              <div>
                <LabelEl>開倉日期 Open Date</LabelEl>
                <input type="date" value={f.openDate} onChange={e => set('openDate', e.target.value)} />
              </div>
              <div>
                <LabelEl>買入 Premium / 股</LabelEl>
                <input type="number" step="0.01" placeholder="0.00" value={f.entryPremium} onChange={e => set('entryPremium', e.target.value)} />
              </div>
            </Row>
            {f.status === 'closed' && <Row>
              <div>
                <LabelEl>平倉日期 Close Date</LabelEl>
                <input type="date" value={f.closeDate} onChange={e => set('closeDate', e.target.value)} />
              </div>
              <div>
                <LabelEl>平倉 Premium / 股</LabelEl>
                <input type="number" step="0.01" placeholder="0.00" value={f.exitPremium} onChange={e => set('exitPremium', e.target.value)} />
              </div>
            </Row>}
          </>)}

          {pnl !== null && (
            <div style={{ background: pnl >= 0 ? '#22c55e12' : '#ef444412', border:`1px solid ${pnl >= 0 ? '#22c55e40' : '#ef444440'}`, borderRadius:10, padding:16, textAlign:'center' }}>
              <div style={{ color:'#64748b', fontSize:12, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.05em' }}>計算損益</div>
              <div style={{ fontSize:28, fontWeight:900, color: pnl >= 0 ? '#4ade80' : '#f87171', marginTop:4 }}>{fmtPnL(pnl)}</div>
            </div>
          )}

          <div>
            <LabelEl>交易筆記 Notes</LabelEl>
            <textarea rows={3} placeholder="記錄進出場邏輯、情緒狀態、策略心得..." value={f.notes}
              onChange={e => set('notes', e.target.value)} style={{ resize:'vertical' }} />
          </div>

          <div>
            <LabelEl>標籤 Tags <span style={{ color:'#475569', textTransform:'none', letterSpacing:0 }}>(逗號分隔)</span></LabelEl>
            <input placeholder="swing, breakout, earnings, macro..." value={f.tags} onChange={e => set('tags', e.target.value)} />
          </div>

          <div style={{ display:'flex', gap:12, paddingTop:4 }}>
            <button onClick={onCancel} style={{ flex:1, padding:'13px 0', borderRadius:10, background:'transparent', color:'#94a3b8', border:'1px solid #334155', fontWeight:600, fontSize:15 }} className="action-btn">取消</button>
            <button onClick={handleSubmit} style={{ flex:2, padding:'13px 0', borderRadius:10, background:'#3b82f6', color:'#fff', border:'none', fontWeight:700, fontSize:15 }} className="action-btn">新增交易 ＋</button>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ===================== DASHBOARD ===================== */
const Dashboard = ({ trades }) => {
  const closed = trades.filter(t => t.status === 'closed');
  const open = trades.filter(t => t.status === 'open');
  const winners = closed.filter(t => t.pnl > 0);
  const losers = closed.filter(t => t.pnl < 0);
  const totalPnL = closed.reduce((s, t) => s + t.pnl, 0);
  const winRate = closed.length > 0 ? (winners.length / closed.length * 100) : 0;
  const avgWin = winners.length > 0 ? winners.reduce((s,t) => s+t.pnl, 0) / winners.length : 0;
  const avgLoss = losers.length > 0 ? losers.reduce((s,t) => s+t.pnl, 0) / losers.length : 0;
  const pfRatio = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : null;
  const best = closed.length > 0 ? closed.reduce((b, t) => t.pnl > b.pnl ? t : b, closed[0]) : null;
  const worst = closed.length > 0 ? closed.reduce((w, t) => t.pnl < w.pnl ? t : w, closed[0]) : null;

  const recent = [...trades].sort((a,b) => {
    const da = a.type === 'stock' ? a.entryDate : a.openDate;
    const db = b.type === 'stock' ? b.entryDate : b.openDate;
    return (db||'').localeCompare(da||'');
  }).slice(0, 6);

  return (
    <div style={{ display:'grid', gap:20 }}>
      {/* Stat cards */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(210px, 1fr))', gap:14 }}>
        <StatCard label="總損益 Total P&L" value={fmtPnL(totalPnL)} sub={`共 ${closed.length} 筆已結清`}
          color={totalPnL >= 0 ? '#4ade80' : '#f87171'} icon={totalPnL >= 0 ? 'trending_up' : 'trending_down'} />
        <StatCard label="勝率 Win Rate" value={`${winRate.toFixed(1)}%`} sub={`${winners.length} 勝 / ${losers.length} 敗`}
          color="#60a5fa" icon="bar_chart" />
        <StatCard label="持倉中 Open" value={open.length} sub="尚未平倉的倉位"
          color="#fbbf24" icon="lock_open" />
        <StatCard label="盈虧比 P/L Ratio" value={pfRatio ? pfRatio.toFixed(2) : '—'} sub={pfRatio ? `均盈 ${fmt$(avgWin)} · 均虧 ${fmt$(avgLoss)}` : '尚無資料'}
          color="#a78bfa" icon="award" />
      </div>

      {/* Charts */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
        <MonthlyChart trades={trades} />
        <EquityCurve trades={trades} />
      </div>

      {/* Best / Worst */}
      {(best || worst) && (
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
          {best && <div style={{ background:'#1e293b', border:'1px solid #22c55e40', borderRadius:12, padding:20 }}>
            <div style={{ color:'#4ade80', fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 }}>🏆 最佳交易</div>
            <div style={{ fontWeight:800, fontSize:18 }}>{best.ticker}</div>
            <div style={{ color:'#64748b', fontSize:12, marginTop:2 }}>{best.type === 'option' ? `${best.optionType?.toUpperCase()} $${best.strike}` : `${best.shares} 股`}</div>
            <div style={{ color:'#4ade80', fontSize:24, fontWeight:900, marginTop:8 }}>{fmtPnL(best.pnl)}</div>
          </div>}
          {worst && <div style={{ background:'#1e293b', border:'1px solid #ef444440', borderRadius:12, padding:20 }}>
            <div style={{ color:'#f87171', fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:10 }}>📉 最差交易</div>
            <div style={{ fontWeight:800, fontSize:18 }}>{worst.ticker}</div>
            <div style={{ color:'#64748b', fontSize:12, marginTop:2 }}>{worst.type === 'option' ? `${worst.optionType?.toUpperCase()} $${worst.strike}` : `${worst.shares} 股`}</div>
            <div style={{ color:'#f87171', fontSize:24, fontWeight:900, marginTop:8 }}>{fmtPnL(worst.pnl)}</div>
          </div>}
        </div>
      )}

      {/* Recent trades */}
      <div style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:12 }}>
        <div style={{ padding:'16px 22px', borderBottom:'1px solid #334155', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div style={{ fontWeight:700, fontSize:15 }}>近期交易</div>
          <div style={{ color:'#475569', fontSize:12 }}>最新 {recent.length} 筆</div>
        </div>
        <table style={{ width:'100%' }}>
          <tbody>
            {recent.map(t => (
              <tr key={t.id} style={{ borderBottom:'1px solid #0f172a' }}>
                <td style={{ padding:'12px 22px' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span style={{ padding:'2px 8px', borderRadius:5, fontSize:11, fontWeight:700,
                      background: t.type === 'stock' ? '#3b82f620' : '#a855f720',
                      color: t.type === 'stock' ? '#60a5fa' : '#c084fc' }}>
                      {t.type === 'stock' ? '股' : '期'}
                    </span>
                    <div>
                      <div style={{ fontWeight:700 }}>{t.ticker}</div>
                      <div style={{ fontSize:11, color:'#475569' }}>
                        {t.type === 'stock' ? `${t.shares?.toLocaleString()} 股` : `${t.optionType?.toUpperCase()} $${t.strike} × ${t.contracts}`}
                      </div>
                    </div>
                  </div>
                </td>
                <td style={{ padding:'12px 22px', color:'#64748b', fontSize:13 }}>
                  {t.type === 'stock' ? t.entryDate : t.openDate}
                </td>
                <td style={{ padding:'12px 22px', textAlign:'right' }}>
                  {t.status === 'open'
                    ? <span style={{ color:'#fbbf24', fontSize:13, fontWeight:600 }}>持倉中</span>
                    : <span style={{ color: t.pnl >= 0 ? '#4ade80' : '#f87171', fontWeight:800, fontSize:15 }}>{fmtPnL(t.pnl)}</span>
                  }
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

/* ===================== TRADE HISTORY ===================== */
const TradeHistory = ({ trades, onView, onClose, onDelete }) => {
  const [search, setSearch] = useState('');
  const [fType, setFType] = useState('all');
  const [fStatus, setFStatus] = useState('all');

  const filtered = useMemo(() => {
    return trades.filter(t => {
      const q = search.toUpperCase();
      const matchQ = !q || t.ticker.includes(q) || (t.notes||'').toLowerCase().includes(search.toLowerCase()) || (t.tags||[]).some(tag => tag.includes(search.toLowerCase()));
      const matchType = fType === 'all' || t.type === fType;
      const matchStatus = fStatus === 'all' || t.status === fStatus;
      return matchQ && matchType && matchStatus;
    }).sort((a, b) => {
      const da = a.type === 'stock' ? a.entryDate : a.openDate;
      const db = b.type === 'stock' ? b.entryDate : b.openDate;
      return (db||'').localeCompare(da||'');
    });
  }, [trades, search, fType, fStatus]);

  const filteredPnL = filtered.filter(t => t.status === 'closed').reduce((s, t) => s + t.pnl, 0);

  return (
    <div>
      {/* Filter bar */}
      <div style={{ display:'flex', gap:10, marginBottom:20, flexWrap:'wrap', alignItems:'center' }}>
        <div style={{ position:'relative', flex:1, minWidth:200 }}>
          <div style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'#475569', pointerEvents:'none' }}>
            <Ico name="search" size={16} />
          </div>
          <input placeholder="搜尋代碼、筆記、標籤..." value={search}
            onChange={e => setSearch(e.target.value)} style={{ paddingLeft:36 }} />
        </div>
        <select value={fType} onChange={e => setFType(e.target.value)} style={{ width:'auto', minWidth:130 }}>
          <option value="all">全部類型</option>
          <option value="stock">正股</option>
          <option value="option">期權</option>
        </select>
        <select value={fStatus} onChange={e => setFStatus(e.target.value)} style={{ width:'auto', minWidth:130 }}>
          <option value="all">全部狀態</option>
          <option value="open">持倉中</option>
          <option value="closed">已結清</option>
        </select>
        <div style={{ color:'#64748b', fontSize:13, whiteSpace:'nowrap' }}>
          {filtered.length} 筆 &nbsp;·&nbsp;
          <span style={{ color: filteredPnL >= 0 ? '#4ade80' : '#f87171', fontWeight:700 }}>{fmtPnL(filteredPnL)}</span>
        </div>
      </div>

      {/* Table */}
      <div style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:12, overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', minWidth:600 }}>
            <thead>
              <tr style={{ background:'#0f172a', borderBottom:'1px solid #334155' }}>
                {['交易 Trade','日期 Date','狀態','P&L','操作'].map((h, i) => (
                  <th key={h} style={{ padding:'11px 16px', textAlign: i >= 3 ? 'right' : 'left', color:'#475569', fontWeight:600, fontSize:11, textTransform:'uppercase', letterSpacing:'0.05em', whiteSpace:'nowrap' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.length === 0 ? (
                <tr><td colSpan={5} style={{ padding:56, textAlign:'center', color:'#334155' }}>
                  <div style={{ fontSize:40, marginBottom:12 }}>📋</div>
                  <div style={{ fontSize:15 }}>沒有符合的交易記錄</div>
                </td></tr>
              ) : filtered.map(trade => {
                const isOpen = trade.status === 'open';
                const date = trade.type === 'stock' ? trade.entryDate : trade.openDate;
                const closeDate = trade.type === 'stock' ? trade.exitDate : trade.closeDate;
                return (
                  <tr key={trade.id} className="trade-row" style={{ borderBottom:'1px solid #0f172a', cursor:'pointer' }}
                    onClick={() => onView(trade)}>
                    <td style={{ padding:'12px 16px' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                        <span style={{ padding:'3px 8px', borderRadius:6, fontSize:11, fontWeight:700, flexShrink:0,
                          background: trade.type === 'stock' ? '#3b82f620' : '#a855f720',
                          color: trade.type === 'stock' ? '#60a5fa' : '#c084fc' }}>
                          {trade.type === 'stock' ? '股' : '期'}
                        </span>
                        <div>
                          <div style={{ fontWeight:700, fontSize:15 }}>{trade.ticker}</div>
                          <div style={{ fontSize:11, color:'#475569', marginTop:2 }}>
                            {trade.type === 'stock'
                              ? `${trade.direction === 'long' ? 'Long' : 'Short'} ${trade.shares?.toLocaleString()} 股`
                              : `${trade.optionType?.toUpperCase()} $${trade.strike} exp ${trade.expiry} × ${trade.contracts}`}
                          </div>
                        </div>
                      </div>
                    </td>
                    <td style={{ padding:'12px 16px' }}>
                      <div style={{ color:'#94a3b8', fontSize:13 }}>{date}</div>
                      {closeDate && <div style={{ color:'#475569', fontSize:11, marginTop:2 }}>→ {closeDate}</div>}
                    </td>
                    <td style={{ padding:'12px 16px' }}>
                      <span style={{ padding:'4px 10px', borderRadius:99, fontSize:12, fontWeight:600,
                        background: isOpen ? '#f59e0b20' : '#22c55e20',
                        color: isOpen ? '#fbbf24' : '#4ade80' }}>
                        {isOpen ? '持倉中' : '已結清'}
                      </span>
                    </td>
                    <td style={{ padding:'12px 16px', textAlign:'right' }}>
                      {isOpen
                        ? <span style={{ color:'#475569', fontSize:13 }}>—</span>
                        : <span style={{ fontWeight:800, fontSize:16, color: trade.pnl >= 0 ? '#4ade80' : '#f87171' }}>{fmtPnL(trade.pnl)}</span>
                      }
                    </td>
                    <td style={{ padding:'12px 16px' }}>
                      <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }} onClick={e => e.stopPropagation()}>
                        {isOpen && (
                          <button onClick={() => onClose(trade)} style={{ padding:'5px 12px', borderRadius:7, fontSize:12, background:'#22c55e20', color:'#4ade80', border:'none', fontWeight:700 }} className="action-btn">
                            平倉
                          </button>
                        )}
                        <button onClick={() => onView(trade)} style={{ padding:7, borderRadius:7, background:'#334155', color:'#94a3b8', border:'none', display:'flex' }} className="action-btn">
                          <Ico name="eye" size={14} />
                        </button>
                        <button onClick={() => { if(window.confirm('確認刪除？')) onDelete(trade.id); }} style={{ padding:7, borderRadius:7, background:'#ef444420', color:'#f87171', border:'none', display:'flex' }} className="action-btn">
                          <Ico name="trash" size={14} />
                        </button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

/* ===================== JOURNAL PAGE ===================== */

  { key:'win',     icon:'🏆', label:'盈利' },
  { key:'loss',    icon:'📉', label:'虧損' },
  { key:'learn',   icon:'💡', label:'學習' },
  { key:'plan',    icon:'🎯', label:'計劃' },
  { key:'neutral', icon:'📝', label:'一般' },
];

const JournalPage = ({ notes, onChange }) => {
  const todayStr = new Date().toISOString().split('T')[0];
  const blank = { date:todayStr, title:'', content:'', mood:'neutral', tags:'' };
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState(blank);
  const [expanded, setExpanded] = useState({});

  const setF = k => v => setForm(f => ({...f, [k]: v}));

  const save = () => {
    const entry = {
      ...form,
      id: editId || ('note-' + Date.now()),
      tags: typeof form.tags === 'string' ? form.tags.split(/[，,\s]+/).filter(Boolean) : form.tags,
      createdAt: editId ? (notes.find(n=>n.id===editId)?.createdAt || todayStr) : todayStr,
    };
    if (editId) {
      onChange(notes.map(n => n.id === editId ? entry : n));
    } else {
      onChange([entry, ...notes]);
      setExpanded(e => ({...e, [entry.id]: true}));

        {!showForm && (
          <button onClick={() => { setShowForm(true); setEditId(null); setForm(blank); }}
            style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 20px', borderRadius:10,
              background:'#3b82f6', color:'#fff', border:'none', fontWeight:700, fontSize:14 }}
            className="action-btn">
            <Ico name="plus" size={16} />寫日誌
          </button>

          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16 }}>
            <div>
              <label style={{ fontSize:12, color:'#94a3b8', fontWeight:600, display:'block', marginBottom:6 }}>日期</label>

              <label style={{ fontSize:12, color:'#94a3b8', fontWeight:600, display:'block', marginBottom:6 }}>標記</label>

          </div>
          <div style={{ marginBottom:22 }}>
            <label style={{ fontSize:12, color:'#94a3b8', fontWeight:600, display:'block', marginBottom:6 }}>標籤（逗號分隔）</label>
            <input type="text" placeholder="NVDA, 期權, 反思..." value={form.tags} onChange={e => setF('tags')(e.target.value)} />
          </div>
          <div style={{ display:'flex', gap:12 }}>
            <button onClick={save} disabled={!form.title.trim()} style={{
              padding:'10px 24px', borderRadius:10, fontWeight:700, fontSize:14, border:'none', color:'#fff',
              background: form.title.trim() ? '#3b82f6' : '#334155',
            }}>{editId ? '儲存修改' : '發布日誌'}</button>
            <button onClick={() => { setShowForm(false); setEditId(null); setForm(blank); }} style={{
              padding:'10px 20px', borderRadius:10, background:'transparent', color:'#64748b',
              border:'1px solid #334155', fontWeight:600, fontSize:14,
            }}>取消</button>
          </div>
        </div>
      )}

      {notes.length === 0 && !showForm && (
        <div style={{ textAlign:'center', padding:'80px 0', color:'#475569' }}>
          <div style={{ fontSize:48, marginBottom:16 }}>📔</div>
          <div style={{ fontSize:16, fontWeight:600 }}>還沒有日誌</div>
          <div style={{ fontSize:13, marginTop:8 }}>點擊「寫日誌」開始記錄你的交易反思</div>
        </div>
      )}

      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
        {notes.map(note => {
          const mood = moodOf(note.mood);
          const isOpen = expanded[note.id] !== false;
          return (
            <div key={note.id} style={{ background:'#1e293b', border:'1px solid #334155', borderRadius:14, overflow:'hidden' }}>
              <div onClick={() => toggle(note.id)} style={{ display:'flex', alignItems:'center', gap:14, padding:'18px 22px', cursor:'pointer' }}>
                <div style={{ fontSize:24, flexShrink:0 }}>{mood.icon}</div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:700, fontSize:15, color:'#f1f5f9' }}>{note.title}</div>
                  <div style={{ color:'#64748b', fontSize:12, marginTop:3 }}>{note.date} · {mood.label}</div>
                </div>
                {Array.isArray(note.tags) && note.tags.length > 0 && (
                  <div style={{ display:'flex', gap:6, flexWrap:'wrap', justifyContent:'flex-end', maxWidth:220 }}>
                    {note.tags.slice(0,4).map(t => (
                      <span key={t} style={{ background:'#0f172a', color:'#94a3b8', fontSize:11, padding:'3px 8px', borderRadius:6, border:'1px solid #334155' }}>{t}</span>
                    ))}
                  </div>
                )}
                <div style={{ color:'#475569', fontSize:14, marginLeft:8, flexShrink:0 }}>{isOpen ? '▲' : '▼'}</div>
              </div>
              {isOpen && (
                <div style={{ padding:'0 22px 22px' }}>
                  <div style={{ borderTop:'1px solid #334155', paddingTop:18 }}>
                    <pre style={{ fontFamily:'inherit', whiteSpace:'pre-wrap', color:'#cbd5e1', fontSize:14, lineHeight:1.85 }}>{note.content}</pre>
                    <div style={{ display:'flex', gap:10, marginTop:20 }}>
                      <button onClick={() => startEdit(note)} style={{ padding:'7px 16px', borderRadius:8, background:'transparent', color:'#60a5fa', border:'1px solid #3b82f640', fontSize:13, fontWeight:600 }}>✏️ 編輯</button>
                      <button onClick={() => del(note.id)} style={{ padding:'7px 16px', borderRadius:8, background:'transparent', color:'#f87171', border:'1px solid #f8717140', fontSize:13, fontWeight:600 }}>🗑 刪除</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* ===================== APP ===================== */
function App() {
  const [trades, setTrades] = useState(loadTrades);
  const [tab, setTab] = useState('dashboard');
  const [showAdd, setShowAdd] = useState(false);
  const [viewTrade, setViewTrade] = useState(null);
  const [closeTrade, setCloseTrade] = useState(null);

  const [notes, setNotes] = useState(loadNotes);

  useEffect(() => { saveTrades(trades); }, [trades]);
  useEffect(() => { saveNotes(notes); }, [notes]);

  const addTrade = useCallback((t) => { setTrades(p => [t, ...p]); setShowAdd(false); setTab('history'); }, []);
  const deleteTrade = useCallback((id) => { setTrades(p => p.filter(t => t.id !== id)); }, []);
  const doClose = useCallback((trade) => setCloseTrade(trade), []);
  const submitClose = useCallback((id, data) => { setTrades(p => p.map(t => t.id === id ? {...t,...data} : t)); setCloseTrade(null); }, []);

  const openCount = trades.filter(t => t.status === 'open').length;
  const closedPnL = trades.filter(t => t.status === 'closed').reduce((s,t) => s+t.pnl, 0);

  const NavItem = ({ id, icon, label }) => {
    const active = tab === id && !showAdd;
    return (
      <button onClick={() => { setTab(id); setShowAdd(false); }} className="nav-btn" style={{
        display:'flex', alignItems:'center', gap:12, width:'100%', padding:'11px 14px', borderRadius:10,
        background: active ? '#3b82f620' : 'transparent',
        color: active ? '#60a5fa' : '#64748b',
        border: active ? '1px solid #3b82f640' : '1px solid transparent',
        fontWeight: active ? 700 : 500, fontSize:14, textAlign:'left', marginBottom:4,
      }}>
        <Ico name={icon} size={18} />
        <span className="nav-label">{label}</span>
      </button>
    );
  };

  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      {/* Sidebar */}
      <div className="sidebar" style={{ width:230, background:'#1e293b', borderRight:'1px solid #334155', display:'flex', flexDirection:'column', padding:'24px 14px', position:'fixed', top:0, left:0, height:'100vh', zIndex:50 }}>
        <div style={{ marginBottom:32, paddingLeft:4 }}>
          <div className="logo-text">
            <div style={{ fontSize:17, fontWeight:900, color:'#f1f5f9', letterSpacing:'-0.02em' }}>📈 交易日誌</div>
            <div style={{ fontSize:11, color:'#334155', marginTop:3, fontWeight:500 }}>US Stock Journal</div>
          </div>
        </div>

        <nav style={{ flex:1 }}>
          <NavItem id="dashboard" icon="dashboard" label="儀表板" />
          <NavItem id="history" icon="list" label="交易紀錄" />
          <NavItem id="journal" icon="note" label="日誌心得" />
        </nav>

        {/* Add button */}
        <button onClick={() => { setShowAdd(true); setTab(null); }} className="action-btn" style={{
          display:'flex', alignItems:'center', justifyContent:'center', gap:8,
          width:'100%', padding:'13px 0', borderRadius:10,
          background: showAdd ? '#2563eb' : '#3b82f6',
          color:'#fff', border:'none', fontWeight:700, fontSize:14,
          marginBottom:16, transition:'background 0.15s'
        }}>
          <Ico name="plus" size={18} />
          <span className="nav-label">新增交易</span>
        </button>

        {/* Summary */}
        <div className="storage-note" style={{ background:'#0f172a', borderRadius:10, padding:14 }}>
          <div style={{ color:'#475569', fontSize:11, marginBottom:8, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em' }}>總覽</div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
            <span style={{ color:'#64748b', fontSize:12 }}>持倉中</span>
            <span style={{ color:'#fbbf24', fontSize:12, fontWeight:700 }}>{openCount}</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between' }}>
            <span style={{ color:'#64748b', fontSize:12 }}>總損益</span>
            <span style={{ color: closedPnL >= 0 ? '#4ade80' : '#f87171', fontSize:12, fontWeight:700 }}>{fmtPnL(closedPnL)}</span>
          </div>
          <div style={{ color:'#334155', fontSize:10, marginTop:10 }}>資料存於本機瀏覽器</div>
        </div>
      </div>

      {/* Main */}
      <div className="main-content" style={{ marginLeft:230, flex:1, padding:32, minHeight:'100vh' }}>
        {showAdd ? (
          <div className="fade-in">
            <div style={{ marginBottom:28 }}>
              <h1 style={{ fontSize:26, fontWeight:900 }}>新增交易</h1>
              <p style={{ color:'#64748b', marginTop:6 }}>記錄你的正股或期權交易</p>
            </div>
            <AddTradeForm onSubmit={addTrade} onCancel={() => { setShowAdd(false); setTab('dashboard'); }} />
          </div>
        ) : tab === 'dashboard' ? (
          <div className="fade-in">
            <div style={{ marginBottom:28, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <h1 style={{ fontSize:26, fontWeight:900 }}>儀表板</h1>
                <p style={{ color:'#64748b', marginTop:6 }}>交易績效總覽</p>
              </div>
              <button onClick={() => setShowAdd(true)} style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 20px', borderRadius:10, background:'#3b82f6', color:'#fff', border:'none', fontWeight:700, fontSize:14 }} className="action-btn">
                <Ico name="plus" size={16} />新增交易
              </button>
            </div>
            <Dashboard trades={trades} />
          </div>
        ) : tab === 'history' ? (
          <div className="fade-in">
            <div style={{ marginBottom:28, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <div>
                <h1 style={{ fontSize:26, fontWeight:900 }}>交易紀錄</h1>
                <p style={{ color:'#64748b', marginTop:6 }}>所有正股與期權交易 ({trades.length} 筆)</p>
              </div>
              <button onClick={() => setShowAdd(true)} style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 20px', borderRadius:10, background:'#3b82f6', color:'#fff', border:'none', fontWeight:700, fontSize:14 }} className="action-btn">
                <Ico name="plus" size={16} />新增
              </button>
            </div>
            <TradeHistory trades={trades} onView={setViewTrade} onClose={doClose} onDelete={deleteTrade} />
          </div>
        ) : tab === 'journal' ? (
          <div className="fade-in">
            <JournalPage notes={notes} onChange={setNotes} />
          </div>
        ) : null}
      </div>

      {/* Modals */}
      {viewTrade && <TradeDetailModal trade={viewTrade} onClose={() => setViewTrade(null)} onDelete={(id) => { deleteTrade(id); setViewTrade(null); }} />}
      {closeTrade && <CloseTradeModal trade={closeTrade} onClose={() => setCloseTrade(null)} onSubmit={(data) => submitClose(closeTrade.id, data)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
